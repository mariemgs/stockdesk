# EXAMPLE ONLY - placeholder values, never real ones, never applied as is.
# The real Secret is created by a cluster administrator from values kept outside
# Git (password manager), for example:
#
#   kubectl -n stockdesk create secret generic stockdesk-env \
#     --from-literal=DB_PASSWORD="$(read -rs p; echo "$p")" \
#     --from-literal=API_KEY="$(read -rs k; echo "$k")"
#
# (read -s keeps the values out of the shell history.)
apiVersion: v1
kind: Secret
metadata:
  name: stockdesk-env
  namespace: stockdesk
type: Opaque
stringData:
  DB_PASSWORD: "example-not-a-real-password"
  API_KEY: "example-not-a-real-key"
