# Applied by a cluster administrator (not by CI). Identity of the StockDesk pods.
# Kept out of CI's reach: the CI identity has no right on ServiceAccounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stockdesk
  namespace: stockdesk
  labels:
    app: stockdesk
# The application does not call the Kubernetes API: no token is mounted.
automountServiceAccountToken: false
