# Applied by a cluster administrator (not by CI), so that a stolen CI credential
# cannot open the network. Only enforced if the cluster's network plugin supports NetworkPolicy (to verify).
# 1) Deny everything in the namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: stockdesk
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2) StockDesk: accept HTTP on 3000 only; outbound only DNS and TCP port 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stockdesk
  namespace: stockdesk
spec:
  podSelector:
    matchLabels:
      app: stockdesk
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # From any source, because LoadBalancer traffic arrives from node / LB
    # addresses; the source filtering is done by loadBalancerSourceRanges (service.yaml).
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Port 5432 to ANY address: this limits the port, not the server. Remaining risk
    # (RISKS.md #13): a compromised pod could send data out to any host on 5432.
    # Where "db" runs is not documented in the repository. Once known, add a "to":
    #   - if "db" is a pod in namespace "default":
    #       to:
    #         - namespaceSelector:
    #             matchLabels:
    #               kubernetes.io/metadata.name: default
    #           podSelector:
    #             matchLabels:
    #               app: <label of the database pods>
    #   - if it is outside the cluster:  to: [{ipBlock: {cidr: <db address>/32}}]
    - ports:
        - protocol: TCP
          port: 5432
