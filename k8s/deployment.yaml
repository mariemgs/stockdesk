# StockDesk on the shared test cluster.
# Applied by the CI deploy job with "kubectl apply -k" (see k8s/kustomization.yaml),
# which also replaces the image reference by the digest that the pipeline built and scanned.
# Objects that need more rights or are security decisions (namespace, ServiceAccounts,
# CI identity, Secret, Service exposure, NetworkPolicies) are in k8s/admin/ and are applied by a
# cluster administrator, never by CI.
# Non-secret settings. Same variable names as before.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stockdesk-config
  namespace: stockdesk
  labels:
    app: stockdesk
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Was "db" when the app ran in namespace "default". A short name resolves in the
  # pod's own namespace, so in "stockdesk" it would point to a Service that does not exist.
  # ASSUMPTION (not verifiable from this repo, which defines no database Service):
  # the database is the Service "db" in namespace "default".
  # "db.default.svc" (without ".cluster.local") works whatever the cluster's DNS domain is.
  # TODO verify before deploying: README, cluster checklist, step 1.
  DB_HOST: "db.default.svc"
  DB_PORT: "5432"
  DB_USER: "stockdesk"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockdesk
  namespace: stockdesk
  labels:
    app: stockdesk
spec:
  # Kept at 1 on purpose: the stock is held in memory (src/server.js), so two
  # replicas would each have their own stock and answer differently. Raise it
  # (and add a PodDisruptionBudget) once the data really lives in PostgreSQL.
  replicas: 1
  revisionHistoryLimit: 3
  # Recreate, not RollingUpdate: a rolling update starts the new pod before the old
  # one stops, so for a few seconds two pods with two different stocks would both
  # receive traffic. Trade-off accepted: a short outage at each deploy (consistency
  # over availability). Note that every restart still resets the in-memory stock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stockdesk
  template:
    metadata:
      labels:
        app: stockdesk
    spec:
      serviceAccountName: stockdesk
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stockdesk
          # Placeholder tag that does not exist: applying this file without the CI
          # overlay fails loudly instead of silently pulling a mutable ":latest".
          image: registry.corvane.example/stockdesk:pinned-by-ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: stockdesk-config
            # Created out of band by a cluster admin (k8s/admin/secret.example.yaml).
            # Holds DB_PASSWORD and API_KEY only.
            - secretRef:
                name: stockdesk-env
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Liveness does not depend on the database: a database outage must not
          # make Kubernetes kill and restart the pod in a loop.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness does: no traffic is sent while the database is unreachable.
          # timeoutSeconds is above the 1 s TCP check done by /health.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # The root filesystem is read-only; the app writes a marker file in /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
